<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<title>Вход</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="card">
<h2>Вход</h2>
<form id="loginForm">
  <input id="username" placeholder="Логин" required>
  <input id="password" type="password" placeholder="Пароль" required>
  <button>Войти</button>
</form>
<p><a href="/static/register.html">Нет аккаунта? Регистрация</a></p>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const res = await fetch("/api/login", { method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username: document.getElementById("username").value,
                          password: document.getElementById("password").value}) });
  const d = await res.json();
  if (!res.ok) return alert(d.detail || "Ошибка");
  localStorage.setItem("aviation_token", d.token);
  location.href = "/";
});
</script>
</main></body></html>
